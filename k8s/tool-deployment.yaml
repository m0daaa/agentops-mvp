apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tool-service
  template:
    metadata:
      labels:
        app: tool-service
    spec:
      containers:
        - name: tool
          image: tool-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: TOOL_VERSION
              value: "v1"
            - name: TOOL_SLEEP_MS
              value: "100"
            - name: TOOL_BUSY_MS
              value: "0"
            # 預設關閉，保護已定案的 Experiment B（HPA/CPU）數據不受新的
            # model-service 網路呼叫影響。要展示 Model 層獨立更新時，用
            # `kubectl set env deployment/tool-service CALL_MODEL=true` 手動開啟。
            - name: CALL_MODEL
              value: "false"
            - name: MODEL_URL
              value: "http://model-service:8080/predict"
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: tool-service
spec:
  selector:
    app: tool-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
